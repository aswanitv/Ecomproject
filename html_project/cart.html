<!DOCTYPE html>
<html>
<head>
    <title>My Cart - Shopuniverse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="navbar">
    <div class="logo">
        <img src="Gemini_Generated_Image_p49shtp49shtp49s.png">
    </div>

    <div class="nav-links">
        <a href="index.html">Home</a>
    </div>
</div>

<h1 style="text-align:center; margin-top:20px;">My Cart</h1>

<div id="cart-items" style="padding:20px;"></div>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let container = document.getElementById("cart-items");

if(cart.length === 0){
    container.innerHTML = "<p style='text-align:center;'>Your cart is empty</p>";
} else {
    cart.forEach(item => {
        container.innerHTML += `
            <div style="border:1px solid #ddd; padding:15px; margin:10px;">
                <img src="${item.image}" width="100">
                <h3>${item.name}</h3>
                <p>₹${item.price}</p>
            </div>
        `;
    });
}
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Login - shopify</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(to right, #1f1c2c, #928dab);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 350px;
            padding: 30px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background-color: #111;
            color: #f1c40f;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn-login:hover {
            background-color: #000;
        }

        .btn-google {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: #f9f9f9;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-google:hover {
            background-color: #eee;
        }

        .register {
            margin-top: 15px;
            font-size: 14px;
        }

        .register a {
            color: #000;
            font-weight: bold;
            text-decoration: none;
        }

        .register a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<script>
function loginUser(event) {
    event.preventDefault();

    let username = document.getElementById("loginUsername").value;
    let password = document.getElementById("loginPassword").value;
    let message = document.getElementById("loginMessage");

    let storedUser = JSON.parse(localStorage.getItem("user"));

    if (!storedUser) {
        message.textContent = "No user found. Please register first.";
        return;
    }

    if (username === storedUser.username && password === storedUser.password) {
        message.style.color = "green";
        message.textContent = "Login successful! Redirecting...";

        setTimeout(() => {
            window.location.href = "index.html";
        }, 1500);
    } else {
        message.textContent = "Invalid username or password!";
    }
}
</script>
<body>

    <div class="login-container">
        <h2>Shopuniverse Login</h2>

        <form onsubmit="loginUser(event)">
    <input type="text" id="loginUsername" placeholder="Username" required>
    <input type="password" id="loginPassword" placeholder="Password" required>

    <button type="submit">Login</button>
</form>

<p id="loginMessage" style="color:red;"></p>

        <button class="btn-google">Continue with Google</button>

        <div class="register">
            <p>Don't have an account? <a href="registerhere.html">Register here</a></p>
        </div>
    </div>

</body>
</html>

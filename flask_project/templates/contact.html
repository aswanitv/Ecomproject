{% extends 'base.html' %}

{% block title %}Contact - Shopuniverse{% endblock %}

{% block content %}

<!-- CONTACT SECTION -->
<div class="contact-hero">
    <h1></h1>
</div>

<div class="contact-container">

    <div class="contact-content">

        <!-- CONTACT FORM -->
        <div style="
            background-color: #e8edf2;
            border-radius: 16px;
            padding: 40px 35px;
            width: 350px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 12px;
        ">
            <h2 style="text-align: center; font-size: 22px; color: #111; margin-bottom: 10px;">Contact Us</h2>

            <input type="text" placeholder="Full Name" required style="
                width: 100%;
                padding: 12px 15px;
                border: 1px solid #ccc;
                border-radius: 8px;
                font-size: 14px;
                background: white;
                outline: none;
            ">

            <input type="email" placeholder="Email" required style="
                width: 100%;
                padding: 12px 15px;
                border: 1px solid #ccc;
                border-radius: 8px;
                font-size: 14px;
                background: white;
                outline: none;
            ">

            <textarea placeholder="Message" required rows="4" style="
                width: 100%;
                padding: 12px 15px;
                border: 1px solid #ccc;
                border-radius: 8px;
                font-size: 14px;
                background: white;
                outline: none;
                resize: vertical;
            "></textarea>

            <button type="submit" style="
                width: 100%;
                padding: 12px;
                background-color: #1a1a1a;
                color: #f5c518;
                border: none;
                border-radius: 8px;
                font-size: 15px;
                font-weight: bold;
                cursor: pointer;
                letter-spacing: 0.5px;
            ">Send Message</button>
        </div>

        <!-- CONTACT DETAILS -->
        <div style="width: 300px; text-align: left; padding: 20px;">

            <h2 style="font-size: 22px; color: #111; margin-bottom: 25px;">Get In Touch</h2>

            <p style="font-size: 15px; color: #333; margin-bottom: 5px;">📍 <strong>Our Office</strong></p>
            <p style="font-size: 14px; color: #555; margin-bottom: 20px;">Shopuniverse Pvt Ltd<br>Trivandrum, Kerala, India</p>

            <p style="font-size: 15px; color: #333; margin-bottom: 5px;">✉️ <strong>Email</strong></p>
            <p style="font-size: 14px; color: #555; margin-bottom: 20px;">support@shopuniverse.com</p>

            <p style="font-size: 15px; color: #333; margin-bottom: 5px;">📞 <strong>Phone</strong></p>
            <p style="font-size: 14px; color: #555; margin-bottom: 25px;">+91 98765 43210</p>

            <a href="mailto:support@shopuniverse.com" style="
                display: inline-block;
                background-color: #1a1a1a;
                color: #f5c518;
                padding: 11px 30px;
                border-radius: 8px;
                text-decoration: none;
                font-weight: bold;
                font-size: 15px;
            ">Email Us</a>

        </div>

    </div>

</div>

{% endblock %}

{% extends 'base.html' %}

{% block title %}Login - Shopuniverse{% endblock %}

{% block content %}
<!-- LOGIN SECTION -->
<div style="
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(to right, #c2f0ff, #e8f8ff);
    padding: 40px 20px;
">
    <div style="
        background-color: #e8edf2;
        border-radius: 16px;
        padding: 40px 35px;
        width: 380px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        display: flex;
        flex-direction: column;
        gap: 12px;
    ">
        <h2 style="text-align: center; font-size: 22px; color: #111; margin-bottom: 10px;">Shopuniverse Login</h2>

        <div id="login-error" style="display:none; padding: 12px 14px; margin-bottom: 12px; border-radius: 10px; background: #ffe1e1; color: #9a1212; font-weight: 600;"></div>

        <form id="login-form" action="{{ url_for('login') }}" method="POST" style="display: flex; flex-direction: column; gap: 12px;">

            <input type="text" name="username" placeholder="Username" required style="
                width: 100%; padding: 12px 15px;
                border: 1px solid #ccc; border-radius: 8px;
                font-size: 14px; background: white; outline: none;
            ">

            <input type="password" name="password" placeholder="Password" required style="
                width: 100%; padding: 12px 15px;
                border: 1px solid #ccc; border-radius: 8px;
                font-size: 14px; background: white; outline: none;
            ">

            <button type="submit" style="
                width: 100%; padding: 12px;
                background-color: #1a1a1a; color: #f5c518;
                border: none; border-radius: 8px;
                font-size: 15px; font-weight: bold;
                cursor: pointer; letter-spacing: 0.5px; margin: 0;
            ">Login</button>

        </form>

        <a href="#" style="
            width: 100%; display: block; padding: 12px;
            background-color: white; color: #333;
            border: 1px solid #ccc; border-radius: 8px;
            font-size: 14px; text-align: center;
            text-decoration: none; margin: 0;
        ">Continue with Google</a>

        <p style="text-align: center; font-size: 13px; color: #555; margin-top: 5px;">
            Don't have an account?
            <a href="{{ url_for('register') }}" style="color: #15c9f6; font-weight: bold; text-decoration: none;">Register here</a>
        </p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function () {
    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("login-error");

    if (!form || !errorBox) {
        return;
    }

    form.addEventListener("submit", async function (event) {
        event.preventDefault();
        errorBox.style.display = "none";
        errorBox.textContent = "";

        const formData = new FormData(form);
        try {
            const response = await fetch(form.action, {
                method: "POST",
                headers: {
                    "X-Requested-With": "XMLHttpRequest",
                    "Accept": "application/json"
                },
                body: formData,
                credentials: "same-origin"
            });

            const data = await response.json().catch(() => null);
            if (response.ok && data && data.success) {
                window.location.href = data.redirect || "{{ url_for('index') }}";
                return;
            }

            errorBox.textContent = (data && data.message) ? data.message : "Invalid email or password.";
            errorBox.style.display = "block";
        } catch (error) {
            errorBox.textContent = "Unable to complete login. Please try again.";
            errorBox.style.display = "block";
        }
    });
});
</script>
{% endblock %}

{% extends 'base.html' %}

{% block title %}Login - Shopuniverse{% endblock %}

{% block content %}
<!-- LOGIN SECTION -->
<div style="
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(to right, #c2f0ff, #e8f8ff);
    padding: 40px 20px;
">
    <div style="
        background-color: #e8edf2;
        border-radius: 16px;
        padding: 40px 35px;
        width: 380px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        display: flex;
        flex-direction: column;
        gap: 12px;
    ">
        <h2 style="text-align: center; font-size: 22px; color: #111; margin-bottom: 10px;">Shopuniverse Login</h2>

        <form action="{{ url_for('login') }}" method="POST" style="display: flex; flex-direction: column; gap: 12px;">

            <input type="text" name="username" placeholder="Username" required style="
                width: 100%; padding: 12px 15px;
                border: 1px solid #ccc; border-radius: 8px;
                font-size: 14px; background: white; outline: none;
            ">

            <input type="password" name="password" placeholder="Password" required style="
                width: 100%; padding: 12px 15px;
                border: 1px solid #ccc; border-radius: 8px;
                font-size: 14px; background: white; outline: none;
            ">

            <button type="submit" style="
                width: 100%; padding: 12px;
                background-color: #1a1a1a; color: #f5c518;
                border: none; border-radius: 8px;
                font-size: 15px; font-weight: bold;
                cursor: pointer; letter-spacing: 0.5px; margin: 0;
            ">Login</button>

        </form>

        <a href="#" style="
            width: 100%; display: block; padding: 12px;
            background-color: white; color: #333;
            border: 1px solid #ccc; border-radius: 8px;
            font-size: 14px; text-align: center;
            text-decoration: none; margin: 0;
        ">Continue with Google</a>

        <p style="text-align: center; font-size: 13px; color: #555; margin-top: 5px;">
            Don't have an account?
            <a href="{{ url_for('register') }}" style="color: #15c9f6; font-weight: bold; text-decoration: none;">Register here</a>
        </p>
    </div>
</div>
{% endblock %}
